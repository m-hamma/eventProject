version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: mohamed.hamma
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - eventproject_postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ../eventProjectFront
    ports:
      - "4200:80"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

volumes:
  eventproject_postgres-data: